[platformio]
default_envs = tab5-bringup
src_dir = src

[env:tab5-bringup]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
lib_ldf_mode = deep
lib_extra_dirs = ../../libraries
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
    https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
    https://github.com/m5stack/M5UnitUnified.git#bf711f370047cf16355b00005450ef615fab36e2
    https://github.com/m5stack/M5Unit-KEYBOARD.git#b58d024f52cc1b1fa4f189a857ef64468369409a
