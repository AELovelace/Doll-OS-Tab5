[platformio]
default_envs = tab5
src_dir = pio
boards_dir = boards

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = doll-tab5-p4
framework = arduino, espidf

; Build ESP-IDF and Arduino together so sdkconfig.defaults controls the real
; IDF libraries instead of only changing macros seen by the sketch.
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    # EspUsbHost conditionally defines helpers at this compile-time level.
    # Runtime ESP-IDF verbosity remains errors-only via sdkconfig.defaults.
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    ; SimpleFTPServer picks its filesystem at compile time, inside its own
    ; translation unit, so FtpServer.ino cannot select it -- it has to be a global
    ; define. Its own default for ESP32 is STORAGE_FFAT, and this board has no FAT
    ; partition (see partitions.csv), so without these the FTP server would serve an
    ; unmounted FFat instead of the SD card Storage.ino mounts. FtpServerKey.h guards
    ; the storage and network defaults behind a single #ifndef, so both must be set.
    -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
    -DDEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD_MMC

; The source preparation step preserves Arduino's generated prototypes while
; the M5GFX step applies the Tab5 ST7123 detection and diagnostic timing patch.
extra_scripts =
    pre:python/prepare_platformio_sketch.py
    pre:python/patch_platformio_m5gfx.py

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Unit-KEYBOARD@0.1.0
    m5stack/M5HAL@0.1.2
    m5stack/M5Utility@0.2.0
    https://github.com/tanakamasayuki/EspUsbHost.git#v2.7.3
    bblanchon/ArduinoJson@7.4.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.4
    https://github.com/xreef/SimpleFTPServer.git#v3.0.2
    https://github.com/liquidCS/esp32ARP.git#0.1.3
    knolleary/PubSubClient@2.8.0
    ewpa/LibSSH-ESP32@5.8.0
    https://github.com/marian-craciunescu/ESP32Ping.git#1.6

upload_protocol = esptool
upload_port = COM38
upload_speed = 460800
monitor_port = COM38
monitor_speed = 115200

[env:emulator]
extends = env:tab5
; PlatformIO otherwise assumes every application belongs in ota_0. Name the
; smaller slot for size validation, then correct esptool's upload address in the
; post-build hook after the ESP-IDF builder has parsed partitions.csv.
board_build.app_partition_name = emulator
; The stock mixed Arduino/ESP-IDF uploader always appends the application at
; ota_0 (0x10000), even when app_partition_name selects ota_1 for size checks.
; Upload only this environment's application image to the emulator slot; shared
; bootloader/partition images are installed by ps/Flash-DualImages.ps1.
upload_protocol = custom
upload_command = "$PYTHONEXE" -X utf8 "$PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py" --chip esp32p4 --port "$UPLOAD_PORT" --baud "$UPLOAD_SPEED" --before default-reset --after hard-reset write-flash -z --flash-mode dio --flash-freq 80m --flash-size 16MB 0x650000 "$SOURCE"
build_flags =
    ${env:tab5.build_flags}
    -DDOLL_EMULATOR_IMAGE=1
extra_scripts =
    ${env:tab5.extra_scripts}
    post:python/configure_emulator_upload.py
; Keep shell/network/radio packages out of this environment's dependency graph,
; not merely out of the final linker image. This makes clean emulator builds
; materially faster and keeps accidental frontend coupling visible.
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Unit-KEYBOARD@0.1.0
    m5stack/M5HAL@0.1.2
    m5stack/M5Utility@0.2.0
    https://github.com/tanakamasayuki/EspUsbHost.git#v2.7.3
