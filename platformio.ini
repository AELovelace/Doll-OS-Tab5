[platformio]
default_envs = tab5
src_dir = pio
boards_dir = boards

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = doll-tab5-p4
framework = arduino, espidf

; Build ESP-IDF and Arduino together so sdkconfig.defaults controls the real
; IDF libraries instead of only changing macros seen by the sketch.
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; The source preparation step preserves Arduino's generated prototypes while
; the M5GFX step applies the Tab5 ST7123 detection and diagnostic timing patch.
extra_scripts =
    pre:python/prepare_platformio_sketch.py
    pre:python/patch_platformio_m5gfx.py

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Unit-KEYBOARD@0.1.0
    m5stack/M5HAL@0.1.2
    m5stack/M5Utility@0.2.0
    https://github.com/tanakamasayuki/EspUsbHost.git#v2.7.3
    bblanchon/ArduinoJson@7.4.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.4
    https://github.com/xreef/SimpleFTPServer.git#v3.0.2
    https://github.com/liquidCS/esp32ARP.git#0.1.3
    knolleary/PubSubClient@2.8.0
    ewpa/LibSSH-ESP32@5.8.0
    https://github.com/marian-craciunescu/ESP32Ping.git#1.6

upload_protocol = esptool
upload_port = COM38
upload_speed = 115200
monitor_port = COM38
monitor_speed = 115200
