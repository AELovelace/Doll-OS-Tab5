name: Tab5 foundation checks

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  input-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the transport-neutral input tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I src/DollInput \
            src/DollInput/DollInput.cpp \
            tests/doll_input_test.cpp \
            -o /tmp/doll_input_test
      - name: Run the input tests
        run: /tmp/doll_input_test

  tab5-arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the pinned external ESP32Ping library
        run: |
          mkdir -p ../libraries
          git clone https://github.com/marian-craciunescu/ESP32Ping.git ../libraries/ESP32Ping
          git -C ../libraries/ESP32Ping checkout aadac3c08f5e6f5062faf26ae1b17e566e22728c
      - name: Create a non-secret CI configuration
        run: cp config.h.example config.h
      - name: Compile the complete Arduino IDE sketch for ESP32-P4
        run: arduino-cli compile --profile tab5 .
